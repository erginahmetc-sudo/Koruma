[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koruma"
version = "0.1.0"
description = "Kendi web sitenizdeki yaygın güvenlik açıklarını bulan, yıkıcı olmayan bir tarayıcı"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Koruma" }]
keywords = ["security", "scanner", "web", "guvenlik", "zafiyet"]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
koruma = "koruma.cli:main"

[tool.setuptools.packages.find]
include = ["koruma*"]

[tool.setuptools.package-data]
koruma = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
